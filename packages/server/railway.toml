# Railway config for the Bluey index service.
# In the Railway service settings, set "Config file path" to /packages/server/railway.toml
# and leave Root Directory empty: the Dockerfile builds from the repo root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/server/Dockerfile"
watchPatterns = ["packages/server/**", "packages/shared/**", "package-lock.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
